[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aaron-sound-sorter"
version = "31.129.0"
description = "Producer-friendly audio sample sorting and diagnostics tool."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26,<3",
  "soundfile>=0.12.1",
  "librosa>=0.10.2,<0.12",
]

[project.optional-dependencies]
neural = [
  "torch>=2.4,<3",
  "transformers>=4.51,<6",
  "scikit-learn>=1.4,<2",
  "safetensors>=0.4,<1",
]
quality = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "coverage[toml]>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.8,<2",
  "pydocstyle>=6.3,<7",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "coverage[toml]>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.8,<2",
  "pydocstyle>=6.3,<7",
  "packaging>=24,<26",
  "tomli>=2,<3; python_version < '3.11'",
  "build>=1.2,<2",
]

[dependency-groups]
quality = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "coverage[toml]>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.8,<2",
  "pydocstyle>=6.3,<7",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "coverage[toml]>=7,<8",
  "ruff>=0.8,<1",
  "mypy>=1.8,<2",
  "pydocstyle>=6.3,<7",
  "packaging>=24,<26",
  "tomli>=2,<3; python_version < '3.11'",
  "build>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/aaron_sound_sorter"]
omit = [
  "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "_reports/quality/htmlcov"

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "._*",
  ".DS_Store",
  "_reports",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# These legacy namespace-bridge modules were split from the original single-file
# runner and intentionally use star-import wiring until the full package
# extraction is retired.  Do not let that legacy pattern hide real issues in new
# domain, engine, infrastructure, or voter modules.
"src/aaron_sound_sorter/brain.py" = ["F403", "F405"]
"src/aaron_sound_sorter/commands.py" = ["F403", "F405"]
"src/aaron_sound_sorter/committee.py" = ["F403", "F405"]
"src/aaron_sound_sorter/features.py" = ["F403", "F405"]
"src/aaron_sound_sorter/io_utils.py" = ["F403", "F405"]
"src/aaron_sound_sorter/preview.py" = ["F403", "F405"]
"src/aaron_sound_sorter/reports.py" = ["F403", "F405"]
"src/aaron_sound_sorter/selftests.py" = ["F403", "F405"]
"src/aaron_sound_sorter/training_labels.py" = ["F403", "F405"]
"src/aaron_sound_sorter/voters/layered_physics_scorer.py" = ["F403", "F405"]
"src/aaron_sound_sorter/voters/physics_branch_layer.py" = ["F403", "F405"]
"src/aaron_sound_sorter/voters/physics_compound_music_layer.py" = ["F403", "F405"]
"src/aaron_sound_sorter/voters/physics_drum_layer.py" = ["F403", "F405"]
"src/aaron_sound_sorter/voters/physics_fx_layer.py" = ["F403", "F405"]
"src/aaron_sound_sorter/voters/physics_instrument_layer.py" = ["F403", "F405"]
"src/aaron_sound_sorter/voters/physics_top_family_layer.py" = ["F403", "F405"]
# Tests and a few CLI audit tools intentionally alter sys.path before imports so
# they can run directly from a checkout without installing the package.
"tests/**/*.py" = ["E402"]
"tools/audit_adaptive_teacher_memory.py" = ["E402"]
"tools/build_neural_vocal_experiment.py" = ["E402"]
"tools/build_neural_vocal_supplement.py" = ["E402"]
"tools/neural_audio_lab.py" = ["E402"]
"tools/neural_vocal_experiment_report.py" = ["E402"]
"tools/run_fx_aaron2_one_by_one_golden_audit.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
files = ["src/aaron_sound_sorter"]

[tool.pydocstyle]
convention = "google"
add-ignore = [
  "D100",
  "D104",
  "D107",
]
match = "^(?!test_|\\._).*\\.py$"
match-dir = "^(?!tests$|_reports$|__pycache__$|\\.pytest_cache$|\\.mypy_cache$|\\.ruff_cache$).*"
